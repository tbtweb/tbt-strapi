name: Deploy Strapi

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest-m

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install

      - name: Build Strapi admin
        run: yarn build

      - name: Archive project
        run: |
          tar -czf app.tar.gz \
            package.json \
            yarn.lock \
            config \
            src \
            public \
            $( [ -d dist ] && echo dist )

      - name: Copy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.tar.gz"
          target: "/home/ubuntu/tbt-strapi"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export PATH=$PATH:/home/ubuntu/.nvm/versions/node/v24.15.0/bin

            cd /home/ubuntu/tbt-strapi

            tar -xzf app.tar.gz

            yarn install --production

            pm2 restart strapi || pm2 start yarn --name "strapi" -- start
